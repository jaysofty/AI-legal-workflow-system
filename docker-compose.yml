services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_flow
    ports:
      - "5432:5432"
    volumes:
      - legal_flow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: legal-flow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - legal_flow_redis_data:/data

volumes:
  legal_flow_postgres_data:
  legal_flow_redis_data: